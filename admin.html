<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF Gallery - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-gray-800 dark:text-gray-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold">SF Gallery Admin Panel</h1>
            <a href="index.html" target="_blank" class="px-4 py-2 bg-green-600 text-white rounded-xl text-xs font-semibold">View Live Store</a>
        </div>

        <!-- Add Product Form -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border mb-8">
            <h3 class="font-bold text-lg mb-4">Add New Product</h3>
            <form onsubmit="saveProduct(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <input type="text" id="a-title" required placeholder="Product Title" class="px-3 py-2 border rounded-xl text-sm bg-gray-50 dark:bg-slate-700">
                <input type="number" id="a-price" required placeholder="Price (BDT)" class="px-3 py-2 border rounded-xl text-sm bg-gray-50 dark:bg-slate-700">
                <select id="a-cat" class="px-3 py-2 border rounded-xl text-sm bg-gray-50 dark:bg-slate-700">
                    <option value="Mobile & Accessories">Mobile & Accessories</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Fashion">Fashion</option>
                    <option value="LifeStyle">LifeStyle</option>
                </select>
                <input type="url" id="a-img" required placeholder="Image URL" class="px-3 py-2 border rounded-xl text-sm bg-gray-50 dark:bg-slate-700 sm:col-span-2">
                <button type="submit" class="bg-green-600 text-white font-semibold py-2 rounded-xl text-sm">Save Product</button>
            </form>
        </div>

        <!-- Customer Orders -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border mb-8">
            <h3 class="font-bold text-lg mb-4">Customer Orders</h3>
            <div id="admin-orders-list" class="space-y-3 text-xs">No orders yet.</div>
        </div>
    </div>

    <script>
        function saveProduct(e) {
            e.preventDefault();
            let products = JSON.parse(localStorage.getItem('sf_products')) || [];
            products.unshift({
                id: Date.now(),
                title: document.getElementById('a-title').value,
                price: parseFloat(document.getElementById('a-price').value),
                category: document.getElementById('a-cat').value,
                img: document.getElementById('a-img').value,
                badge: 'New',
                rating: 5.0
            });
            localStorage.setItem('sf_products', JSON.stringify(products));
            alert('Product Added Successfully!');
            location.reload();
        }

        window.onload = function() {
            let orders = JSON.parse(localStorage.getItem('sf_orders')) || [];
            const container = document.getElementById('admin-orders-list');
            if(orders.length > 0) {
                container.innerHTML = orders.map(o => `
                    <div class="p-3 border rounded-xl flex justify-between items-center bg-gray-50 dark:bg-slate-700">
                        <div>
                            <strong>${o.id}</strong> - ${o.customer} (${o.phone})<br>
                            Items: ${o.items.map(i => i.title + ' (x' + i.qty + ')').join(', ')}
                        </div>
                        <div class="font-bold text-green-600">৳ ${o.total}</div>
                    </div>
                `).join('');
            }
        };
    </script>
</body>
</html>
