<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF Gallery - Admin Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Login Section -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white p-6 rounded-xl shadow-md w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-4 text-center text-slate-900">অ্যাডমিন লগইন</h2>
            <p class="text-xs text-gray-500 text-center mb-4">পাসওয়ার্ড দিয়ে ড্যাশবোর্ডে প্রবেশ করুন</p>
            <input type="password" id="adminPassword" placeholder="পাসওয়ার্ড দিন (admin123)" class="w-full px-4 py-2 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <button onclick="checkLogin()" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2 rounded-lg font-bold transition">লগইন করুন</button>
        </div>
    </div>

    <!-- Admin Dashboard (Hidden initially) -->
    <div id="dashboardSection" class="hidden min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-slate-900 text-white py-3 px-4 shadow-md flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-400">SF Gallery Admin</h1>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded-lg">লগআউট</button>
        </header>

        <!-- Main Form & Product List -->
        <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-1">
            <!-- Add Product Card -->
            <div class="bg-white p-5 rounded-xl shadow-sm mb-6 border border-gray-100">
                <h3 class="text-lg font-bold mb-4 text-gray-700 border-l-4 border-emerald-500 pl-2">নতুন প্রোডাক্ট যোগ করুন</h3>
                <form id="productForm" onsubmit="addProduct(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold mb-1">প্রোডাক্টের নাম</label>
                        <input type="text" id="pName" required class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">মূল্য (টাকা)</label>
                        <input type="number" id="pPrice" required class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">ছবির লিংক (Image URL)</label>
                        <input type="url" id="pImg" placeholder="https://example.com/image.jpg" required class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-emerald-500">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg font-bold text-sm transition">প্রোডাক্ট সেভ করুন</button>
                </form>
            </div>

            <!-- Existing Products List -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-lg font-bold mb-4 text-gray-700 border-l-4 border-emerald-500 pl-2">সকল প্রোডাক্ট তালিকা</h3>
                <div id="adminProductList" class="space-y-3">
                    <!-- Loaded dynamically -->
                </div>
            </div>
        </main>
    </div>

    <!-- Admin Script -->
    <script>
        const correctPassword = "admin123"; // আপনার পছন্দমতো পাসওয়ার্ড এখানে বদলাতে পারেন

        function checkLogin() {
            const pass = document.getElementById('adminPassword').value;
            if(pass === correctPassword) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                loadAdminProducts();
            } else {
                alert('ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।');
            }
        }

        function logout() {
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('adminPassword').value = '';
        }

        function getProducts() {
            const defaultProducts = [
                { id: 1, name: "Smart Watch Ultra", price: 2500, img: "https://via.placeholder.com/200" },
                { id: 2, name: "Wireless Headphones", price: 1800, img: "https://via.placeholder.com/200" }
            ];
            return JSON.parse(localStorage.getItem('sf_products')) || defaultProducts;
        }

        function loadAdminProducts() {
            const products = getProducts();
            const listContainer = document.getElementById('adminProductList');
            
            if(products.length === 0) {
                listContainer.innerHTML = `<p class="text-gray-500 text-sm">কোনো প্রোডাক্ট নেই।</p>`;
                return;
            }

            listContainer.innerHTML = products.map(p => `
                <div class="flex justify-between items-center border-b pb-3">
                    <div class="flex items-center space-x-3">
                        <img src="${p.img}" class="w-12 h-12 object-cover rounded-lg border">
                        <div>
                            <h4 class="font-semibold text-sm">${p.name}</h4>
                            <p class="text-emerald-600 font-bold text-xs">৳${p.price}</p>
                        </div>
                    </div>
                    <button onclick="deleteProduct(${p.id})" class="bg-red-100 hover:bg-red-200 text-red-600 px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                        <i class="fa-solid fa-trash"></i> ডিলিট
                    </button>
                </div>
            `).join('');
        }

        function addProduct(e) {
            e.preventDefault();
            const name = document.getElementById('pName').value;
            const price = Number(document.getElementById('pPrice').value);
            const img = document.getElementById('pImg').value;

            let products = getProducts();
            const newProduct = {
                id: Date.now(),
                name,
                price,
                img
            };

            products.push(newProduct);
            localStorage.setItem('sf_products', JSON.stringify(products));
            
            document.getElementById('productForm').reset();
            loadAdminProducts();
            alert('প্রোডাক্ট সফলভাবে যোগ করা হয়েছে!');
        }

        function deleteProduct(id) {
            if(confirm('আপনি কি সত্যিই এই প্রোডাক্টটি ডিলিট করতে চান?')) {
                let products = getProducts();
                products = products.filter(p => p.id !== id);
                localStorage.setItem('sf_products', JSON.stringify(products));
                loadAdminProducts();
            }
        }
    </script>
</body>
</html>
