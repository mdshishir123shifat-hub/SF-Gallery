<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-4 sm:p-6">
    <div id="toast" class="fixed top-5 right-5 bg-green-600 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg hidden z-50"></div>

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold">Mobile Spec Admin Panel</h1>
            <a href="index.html" target="_blank" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold">View Live Site ↗</a>
        </div>

        <!-- Add / Edit Form -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border mb-8">
            <h3 id="form-title" class="font-bold text-base mb-4 text-emerald-600">Add New Phone</h3>
            <form onsubmit="handleFormSubmit(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                <input type="hidden" id="edit-id">
                <div><label class="font-semibold block mb-1">Phone Name</label><input type="text" id="m-name" required class="w-full px-3 py-2 border rounded-xl"></div>
                <div><label class="font-semibold block mb-1">Brand</label>
                    <select id="m-brand" class="w-full px-3 py-2 border rounded-xl">
                        <option value="Xiaomi">Xiaomi</option><option value="Samsung">Samsung</option><option value="Realme">Realme</option><option value="Vivo">Vivo</option><option value="Apple">Apple</option><option value="Oppo">Oppo</option>
                    </select>
                </div>
                <div><label class="font-semibold block mb-1">Price (BDT)</label><input type="text" id="m-price" required class="w-full px-3 py-2 border rounded-xl" placeholder="28,500"></div>
                <div><label class="font-semibold block mb-1">Status</label><select id="m-status" class="w-full px-3 py-2 border rounded-xl"><option value="Official">Official</option><option value="Unofficial">Unofficial</option></select></div>
                <div class="sm:col-span-2"><label class="font-semibold block mb-1">Image URL</label><input type="url" id="m-img" required class="w-full px-3 py-2 border rounded-xl" placeholder="https://..."></div>
                <div><label class="font-semibold block mb-1">Processor</label><input type="text" id="m-proc" class="w-full px-3 py-2 border rounded-xl" placeholder="Helio G99"></div>
                <div><label class="font-semibold block mb-1">RAM & ROM</label><input type="text" id="m-ram" class="w-full px-3 py-2 border rounded-xl" placeholder="8GB / 256GB"></div>
                <div><label class="font-semibold block mb-1">Camera</label><input type="text" id="m-cam" class="w-full px-3 py-2 border rounded-xl" placeholder="200MP"></div>
                <div><label class="font-semibold block mb-1">Battery</label><input type="text" id="m-bat" class="w-full px-3 py-2 border rounded-xl" placeholder="5000 mAh"></div>
                
                <div class="sm:col-span-3 flex gap-2 mt-3">
                    <button type="submit" id="submit-btn" class="bg-emerald-600 text-white font-semibold px-6 py-2.5 rounded-xl">Save Phone</button>
                    <button type="button" id="cancel-btn" onclick="resetForm()" class="hidden bg-gray-300 px-4 py-2.5 rounded-xl">Cancel</button>
                </div>
            </form>
        </div>

        <!-- Phone List Table -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border">
            <h3 class="font-bold text-base mb-4">Manage Phone Database</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-gray-100 uppercase text-gray-500">
                        <tr><th class="p-2">Phone</th><th class="p-2">Brand</th><th class="p-2">Price</th><th class="p-2 text-right">Action</th></tr>
                    </thead>
                    <tbody id="admin-table" class="divide-y"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let phoneData = JSON.parse(localStorage.getItem('sf_phones')) || [
            { id: 1, name: "Xiaomi Redmi Note 13 Pro", brand: "Xiaomi", price: "28,500", status: "Official", img: "https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=300", ram: "8GB", storage: "256GB", display: '6.67" AMOLED', camera: "200MP", battery: "5000 mAh", proc: "Helio G99" },
            { id: 2, name: "Samsung Galaxy A35 5G", brand: "Samsung", price: "39,999", status: "Official", img: "https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=300", ram: "8GB", storage: "128GB", display: '6.6" Super AMOLED', camera: "50MP", battery: "5000 mAh", proc: "Exynos 1380" }
        ];

        window.onload = function() { renderTable(); };

        function renderTable() {
            document.getElementById('admin-table').innerHTML = phoneData.map(p => `
                <tr class="hover:bg-gray-50">
                    <td class="p-2 flex items-center gap-2"><img src="${p.img}" class="w-8 h-8 object-contain">${p.name}</td>
                    <td class="p-2">${p.brand}</td>
                    <td class="p-2 font-semibold text-emerald-600">৳ ${p.price}</td>
                    <td class="p-2 text-right space-x-1">
                        <button onclick="editPhone(${p.id})" class="px-2 py-1 bg-blue-500 text-white rounded text-[10px]">Edit</button>
                        <button onclick="deletePhone(${p.id})" class="px-2 py-1 bg-red-500 text-white rounded text-[10px]">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const phone = {
                id: id ? parseInt(id) : Date.now(),
                name: document.getElementById('m-name').value,
                brand: document.getElementById('m-brand').value,
                price: document.getElementById('m-price').value,
                status: document.getElementById('m-status').value,
                img: document.getElementById('m-img').value,
                proc: document.getElementById('m-proc').value || 'N/A',
                ram: document.getElementById('m-ram').value || 'N/A',
                camera: document.getElementById('m-cam').value || 'N/A',
                battery: document.getElementById('m-bat').value || 'N/A'
            };

            if(id) {
                const index = phoneData.findIndex(p => p.id == id);
                if(index !== -1) phoneData[index] = phone;
                showToast('Phone Updated Successfully!');
            } else {
                phoneData.unshift(phone);
                showToast('Phone Added Successfully!');
            }

            localStorage.setItem('sf_phones', JSON.stringify(phoneData));
            resetForm();
            renderTable();
        }

        function editPhone(id) {
            const p = phoneData.find(item => item.id == id);
            if(!p) return;
            document.getElementById('edit-id').value = p.id;
            document.getElementById('m-name').value = p.name;
            document.getElementById('m-brand').value = p.brand;
            document.getElementById('m-price').value = p.price;
            document.getElementById('m-status').value = p.status;
            document.getElementById('m-img').value = p.img;
            document.getElementById('m-proc').value = p.proc;
            document.getElementById('m-ram').value = p.ram;
            document.getElementById('m-cam').value = p.camera;
            document.getElementById('m-bat').value = p.battery;

            document.getElementById('form-title').innerText = "Edit Phone Details";
            document.getElementById('submit-btn').innerText = "Update Phone";
            document.getElementById('cancel-btn').classList.remove('hidden');
            window.scrollTo({top:0, behavior:'smooth'});
        }

        function deletePhone(id) {
            if(confirm("Are you sure?")) {
                phoneData = phoneData.filter(p => p.id != id);
                localStorage.setItem('sf_phones', JSON.stringify(phoneData));
                renderTable();
                showToast('Phone Deleted!');
            }
        }

        function resetForm() {
            document.getElementById('edit-id').value = '';
            document.getElementById('m-name').value = '';
            document.getElementById('m-price').value = '';
            document.getElementById('m-img').value = '';
            document.getElementById('m-proc').value = '';
            document.getElementById('m-ram').value = '';
            document.getElementById('m-cam').value = '';
            document.getElementById('m-bat').value = '';
            document.getElementById('form-title').innerText = "Add New Phone";
            document.getElementById('submit-btn').innerText = "Save Phone";
            document.getElementById('cancel-btn').classList.add('hidden');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }
    </script>
</body>
</html>
