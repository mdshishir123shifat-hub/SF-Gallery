<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF Gallery - Premium Shopping</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Header Navigation -->
    <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide text-emerald-400">SF Gallery</h1>
            <div class="relative cursor-pointer" onclick="toggleCartModal()">
                <i class="fa-solid fa-cart-shopping text-2xl"></i>
                <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="bg-gradient-to-r from-slate-800 to-slate-900 text-white py-8 px-4 text-center">
        <h2 class="text-3xl font-extrabold mb-2">Welcome to SF Gallery</h2>
        <p class="text-gray-300 text-sm">আপনার পছন্দের পণ্য কেনাকাটা করুন সহজে ও নিরাপদে</p>
    </section>

    <!-- Main Content / Products Grid -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <h3 class="text-xl font-bold mb-6 text-gray-700 border-l-4 border-emerald-500 pl-3">আমাদের প্রোডাক্টসমূহ</h3>
        
        <div id="productContainer" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- JavaScript dynamically loads products here -->
        </div>
    </main>

    <!-- Cart Modal -->
    <div id="cartModal" class="fixed inset-0 bg-black/60 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full flex flex-col p-5 shadow-2xl overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="text-lg font-bold">আপনার কার্ট (Cart)</h3>
                <button onclick="toggleCartModal()" class="text-gray-500 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="cartItems" class="flex-1 space-y-4">
                <!-- Cart items load here -->
            </div>

            <div class="border-t pt-4 mt-4">
                <div class="flex justify-between font-bold text-lg mb-4">
                    <span>মোট মূল্য:</span>
                    <span>৳<span id="cartTotal">0</span></span>
                </div>
                <button onclick="checkout()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg transition">
                    অর্ডার কনফার্ম করুন
                </button>
            </div>
        </div>
    </div>

    <!-- Script to load products and handle cart -->
    <script>
        // Sample Initial Products (অ্যাডমিন প্যানেল যুক্ত না হওয়া পর্যন্ত টেস্ট ডাটা)
        const defaultProducts = [
            { id: 1, name: "Smart Watch Ultra", price: 2500, img: "https://via.placeholder.com/200" },
            { id: 2, name: "Wireless Headphones", price: 1800, img: "https://via.placeholder.com/200" }
        ];

        let products = JSON.parse(localStorage.getItem('sf_products')) || defaultProducts;
        let cart = [];

        function renderProducts() {
            const container = document.getElementById('productContainer');
            container.innerHTML = products.map(p => `
                <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden p-3 border border-gray-100 flex flex-col justify-between">
                    <img src="${p.img}" alt="${p.name}" class="w-full h-40 object-cover rounded-lg mb-3">
                    <div>
                        <h4 class="font-semibold text-gray-800 text-sm line-clamp-1 mb-1">${p.name}</h4>
                        <p class="text-emerald-600 font-bold text-md">৳${p.price}</p>
                    </div>
                    <button onclick="addToCart(${p.id})" class="mt-3 w-full bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold py-2 rounded-lg transition">
                        কার্টে যোগ করুন
                    </button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const item = products.find(p => p.id === id);
            cart.push(item);
            updateCart();
        }

        function updateCart() {
            document.getElementById('cartCount').innerText = cart.length;
            const cartItems = document.getElementById('cartItems');
            let total = 0;
            
            cartItems.innerHTML = cart.map((item, index) => {
                total += item.price;
                return `
                    <div class="flex justify-between items-center border-b pb-2">
                        <div>
                            <p class="font-medium text-sm">${item.name}</p>
                            <p class="text-emerald-600 font-bold text-xs">৳${item.price}</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-500 text-sm"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            }).join('');
            
            document.getElementById('cartTotal').innerText = total;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function toggleCartModal() {
            document.getElementById('cartModal').classList.toggle('hidden');
        }

        function checkout() {
            if(cart.length === 0) return alert('আপনার কার্ট খালি!');
            alert('অর্ডার সফল হয়েছে! ধন্যবাদ।');
            cart = [];
            updateCart();
            toggleCartModal();
        }

        renderProducts();
    </script>
</body>
</html>
