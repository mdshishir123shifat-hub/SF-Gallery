<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF Mobile Spec - Mobile Phone Prices & Specs in Bangladesh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#16a34a', 600: '#15803d', 700: '#166534' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-slate-900 dark:text-gray-100 min-h-screen flex flex-col">

    <header class="bg-brand-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-2 cursor-pointer" onclick="renderPhones()">
                <div class="bg-white text-brand-600 font-extrabold px-2.5 py-1 rounded-lg text-lg">SF</div>
                <h1 class="text-xl font-bold tracking-wide">MobileDokan Clone</h1>
            </div>
            
            <div class="flex-1 max-w-md">
                <input type="text" id="search-input" oninput="filterPhones()" placeholder="Search mobile phones..." 
                    class="w-full px-4 py-1.5 rounded-full bg-white text-gray-800 text-sm focus:outline-none">
            </div>
    </header>

    <div class="bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700 py-2">
        <div class="max-w-6xl mx-auto px-4 flex items-center gap-2 overflow-x-auto text-xs font-semibold" id="brand-bar"></div>
    </div>

    <main class="max-w-6xl w-full mx-auto px-4 py-6 flex-grow">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold text-gray-800 dark:text-white">Latest Smartphone Prices in Bangladesh</h2>
            <span id="phone-count" class="text-xs text-gray-500 font-semibold"></span>
        </div>

        <div id="phones-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>

        <div id="spec-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
            <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl overflow-y-auto max-h-[90vh] relative">
                <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
                <div id="modal-content"></div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-800 text-gray-400 text-xs py-6 text-center mt-auto">
        <p>© 2026 MobileDokan Clone Portal.</p>
    </footer>

    <script>
        let phoneData = JSON.parse(localStorage.getItem('sf_phones')) || [
            { id: 1, name: "Xiaomi Redmi Note 13 Pro", brand: "Xiaomi", price: "28,500", status: "Official", img: "https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=300", ram: "8GB", storage: "256GB", display: '6.67" AMOLED', camera: "200MP", battery: "5000 mAh", proc: "Helio G99" },
            { id: 2, name: "Samsung Galaxy A35 5G", brand: "Samsung", price: "39,999", status: "Official", img: "https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=300", ram: "8GB", storage: "128GB", display: '6.6" Super AMOLED', camera: "50MP", battery: "5000 mAh", proc: "Exynos 1380" }
        ];

        const brands = ["All", "Xiaomi", "Samsung", "Realme", "Vivo", "Apple", "Oppo"];
        let selectedBrand = "All";

        window.onload = function() { renderBrands(); renderPhones(); };

        function renderBrands() {
            document.getElementById('brand-bar').innerHTML = brands.map(b => `
                <button onclick="selectBrand('${b}')" class="px-3 py-1 rounded-full border transition ${selectedBrand === b ? 'bg-brand-600 text-white border-brand-600' : 'bg-gray-100 dark:bg-slate-700 text-gray-700 dark:text-gray-300 border-gray-300'}">${b}</button>
            `).join('');
        }

        function selectBrand(b) { selectedBrand = b; renderBrands(); renderPhones(); }
        function filterPhones() { renderPhones(); }

        function renderPhones() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const grid = document.getElementById('phones-grid');
            const filtered = phoneData.filter(p => (selectedBrand === "All" || p.brand === selectedBrand) && p.name.toLowerCase().includes(query));
            
            document.getElementById('phone-count').innerText = `${filtered.length} Phones Found`;
            grid.innerHTML = filtered.map(p => `
                <div onclick="openSpecs(${p.id})" class="bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl p-3 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between group">
                    <div>
                        <div class="h-36 w-full flex items-center justify-center bg-gray-50 dark:bg-slate-700 rounded-lg overflow-hidden mb-2">
                            <img src="${p.img}" class="h-full object-contain group-hover:scale-105 transition">
                        </div>
                        <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${p.status === 'Official' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${p.status}</span>
                        <h3 class="font-bold text-xs mt-1 text-gray-900 dark:text-white line-clamp-2">${p.name}</h3>
                    </div>
                    <div class="mt-2 pt-2 border-t border-gray-100 dark:border-slate-700">
                        <span class="font-extrabold text-brand-600 text-sm">৳ ${p.price}</span>
                    </div>
                </div>
            `).join('');
        }

        function openSpecs(id) {
            const p = phoneData.find(item => item.id === id);
            document.getElementById('modal-content').innerHTML = `
                <div class="text-center mb-4">
                    <img src="${p.img}" class="h-40 mx-auto object-contain mb-2">
                    <h3 class="text-lg font-bold text-gray-900 dark:text-white">${p.name}</h3>
                    <p class="text-emerald-600 font-extrabold text-xl mt-1">৳ ${p.price} BDT (${p.status})</p>
                </div>
                <table class="w-full text-xs text-left border-collapse">
                    <tr class="border-b"><td class="py-2 font-bold text-gray-500 w-1/3">Processor:</td><td class="py-2 font-semibold">${p.proc}</td></tr>
                    <tr class="border-b"><td class="py-2 font-bold text-gray-500">RAM & ROM:</td><td class="py-2 font-semibold">${p.ram} | ${p.storage}</td></tr>
                    <tr class="border-b"><td class="py-2 font-bold text-gray-500">Display:</td><td class="py-2 font-semibold">${p.display}</td></tr>
                    <tr class="border-b"><td class="py-2 font-bold text-gray-500">Camera:</td><td class="py-2 font-semibold">${p.camera}</td></tr>
                    <tr><td class="py-2 font-bold text-gray-500">Battery:</td><td class="py-2 font-semibold">${p.battery}</td></tr>
                </table>
            `;
            document.getElementById('spec-modal').classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeModal() { document.getElementById('spec-modal').classList.add('opacity-0', 'pointer-events-none'); }
    </script>
</body>
</html>
